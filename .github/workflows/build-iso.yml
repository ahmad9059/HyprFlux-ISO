name: Build HyprFlux ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      compression:
        description: Compression recipe (match the candidate being tested)
        type: choice
        options: [xz, zstd]
        default: xz

concurrency:
  group: iso-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    env:
      HYPRFLUX_PACKAGE_CACHE: /var/cache/pacman/pkg
      HYPRFLUX_SIGNING_KEY: ${{ secrets.ISO_SIGNING_FINGERPRINT }}
      GNUPGHOME: /tmp/hyprflux-release-gnupg
      HYPRFLUX_COMPRESSION: ${{ inputs.compression || 'xz' }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso grub git python gnupg gum

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Shell syntax and boot-contract checks
        run: |
          python -m unittest discover -s tests -v
          FAIL=0
          while IFS= read -r -d '' f; do
            bash -n "$f" 2>/dev/null || { echo "BASH SYNTAX FAIL: $f"; FAIL=1; }
          done < <(find airootfs -name '*.sh' -print0)
          bash -n test-qemu.sh 2>/dev/null || { echo "BASH SYNTAX FAIL: test-qemu.sh"; FAIL=1; }
          [ $FAIL -eq 0 ] || exit 1
          grep -q 'systemctl reboot --force --force' airootfs/root/hyprflux-install.sh
          grep -q 'boot once=d' test-qemu.sh
          grep -q -- '--removable' airootfs/root/hyprflux-install.sh
          grep -Eq 'HYPRFLUX_REF="[0-9a-f]{40}"' airootfs/root/hyprflux-install.sh
          echo "All installer scripts parse OK"

      - name: Build ISO
        env:
          ISO_SIGNING_PRIVATE_KEY: ${{ secrets.ISO_SIGNING_PRIVATE_KEY }}
          HYPRFLUX_SIGNING_PASSPHRASE: ${{ secrets.ISO_SIGNING_PASSPHRASE }}
        run: |
          if [[ -n "$HYPRFLUX_SIGNING_KEY" ]]; then
            [[ -n "$ISO_SIGNING_PRIVATE_KEY" ]] || { echo 'Signing fingerprint is set but private key secret is missing.'; exit 1; }
            install -d -m 700 "$GNUPGHOME"
            printf '%s\n' "$ISO_SIGNING_PRIVATE_KEY" | gpg --batch --import
          fi
          echo "Building HyprFlux ISO..."
          bash build.sh
          echo "Build complete."

      - name: Get ISO info
        id: iso
        run: |
          ISO_FILE=$(find out -mindepth 2 -maxdepth 2 -type f -name '*.iso' -print -quit)
          [[ -n "$ISO_FILE" && -f "${ISO_FILE}.sha256" ]]
          ISO_NAME=$(basename "$ISO_FILE")
          ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
          echo "ISO: ${ISO_NAME} (${ISO_SIZE})"
          echo "file=${ISO_FILE}" >> "$GITHUB_OUTPUT"
          echo "name=${ISO_NAME}" >> "$GITHUB_OUTPUT"
          echo "size=${ISO_SIZE}" >> "$GITHUB_OUTPUT"
          (cd "$(dirname "$ISO_FILE")" && sha256sum -c "${ISO_NAME}.sha256")
          echo "SHA256: $(cat "${ISO_FILE}.sha256")"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.iso.outputs.name }}
          path: |
            ${{ steps.iso.outputs.file }}
            ${{ steps.iso.outputs.file }}.sha256
            ${{ steps.iso.outputs.file }}.asc
          retention-days: 14
          compression-level: 0

      - name: Remove ephemeral signing keyring
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf -- /tmp/hyprflux-release-gnupg

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-iso]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "HyprFlux ${{ github.ref_name }}"
          body: |
            ## HyprFlux ${{ github.ref_name }}

            Pre-configured Hyprland desktop on Arch Linux.

            ### Installation

            1. Download the ISO file below
            2. Write to USB:
               ```bash
               sudo dd bs=4M if=hyprflux-*.iso of=/dev/sdX status=progress oflag=sync
               ```
            3. Boot from USB and follow the TUI installer

            ### Features

            - Omarchy-style TUI installer with HyprFlux branding
            - Pre-configured Hyprland + Waybar + Rofi + SwayNC
            - NVIDIA GPU auto-detection and driver installation
            - Both UEFI and Legacy BIOS boot support
            - Automatic or manual disk partitioning
            - PipeWire audio stack
            - Zsh with Oh My Zsh
            - 20+ pre-configured applications

            ### Verify Download

            ```bash
            sha256sum -c hyprflux-*.iso.sha256
            ```

            ### Requirements

            - 64-bit x86 processor
            - 4GB+ RAM (8GB recommended)
            - Desktop: 26 GiB+ disk; Full: 33 GiB+, plus any swap
            - Internet connection during installation
          files: |
            artifacts/**/*.iso
            artifacts/**/*.sha256
            artifacts/**/*.asc
          # A successful ISO build is not an installed-desktop acceptance test.
          # Publish only after the exact image passes tests/README.md's matrix.
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
